# DigitalOcean App Platform — spec do app (web + Managed Postgres).
# Esta é a configuração REAL usada no deploy (git source do repo público +
# cluster Postgres gerenciado "gazeta-db" via doadmin).
#
# WHITELABEL: um único serviço serve as DUAS marcas (gazetadealphaville.com.br
# e aaah.com.br) — mesmo banco, mesma automação SECOM, a marca é resolvida em
# runtime pelo header `host` (ver lib/brand.ts). Por isso os dois domínios
# apontam pro MESMO app/serviço abaixo, não pra apps separados. Nova marca =
# 1 entrada em lib/brand.ts (BRANDS) + 1 domínio novo aqui.
#
# Deploy / atualização:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#   (ou, na criação inicial: doctl apps create --spec .do/app.yaml)
#
# IMPORTANTE: troque os valores SECRET (INBOUND_WEBHOOK_SECRET, ADMIN_TOKEN)
# antes de aplicar — não versione segredos reais neste arquivo público.
name: gazeta-de-alphaville
region: nyc

# domains: fica no NÍVEL DO APP (não do service) — App Platform aceita vários
# domínios customizados apontando pro mesmo app/serviço único abaixo.
domains:
  - domain: gazetadealphaville.com.br
    type: PRIMARY
  - domain: www.gazetadealphaville.com.br
    type: ALIAS
  - domain: aaah.com.br
    type: ALIAS
  - domain: www.aaah.com.br
    type: ALIAS

services:
  - name: web
    dockerfile_path: Dockerfile
    git:
      repo_clone_url: https://github.com/eunielhenrique/gazeta.git
      branch: main
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /
      initial_delay_seconds: 40
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: DIRECT_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: SECOM_ALLOWLIST
        scope: RUN_TIME
        value: secom@santanadeparnaiba.sp.gov.br
      # Bloqueios extras além dos já versionados em lib/sender-policy.ts
      # (smafel@ é bloqueado no código — não depende desta env).
      - key: SECOM_BLOCKLIST
        scope: RUN_TIME
        value: ""
      - key: INBOUND_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: TROQUE_POR_UM_SEGREDO
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: TROQUE_POR_UM_TOKEN

databases:
  - name: db
    engine: PG
    version: "16"
    cluster_name: gazeta-db # cluster Managed Postgres existente
    production: true
    db_name: defaultdb
    db_user: doadmin
